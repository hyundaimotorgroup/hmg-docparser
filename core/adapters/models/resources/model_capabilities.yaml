# Project-maintained API compatibility rules; ordinary users need not edit this file.
# Loaded once on first model lookup. Invalid/missing built-ins disable optional rules, not imports.
# Use an explicitly loaded operator registry for private deployments; see docs/llm-inference.md.
# Exact provider/protocol/model/deployment identities. No prices or connection credentials.
# source/verified_on document evidence; they do not establish live API availability.
version: 1
models:
- provider: openai
  api_type: openai
  model: o3
  modes:
  - effort
  efforts:
  - low
  - medium
  - high
  default_low: true
  sampling: false
  output_token_parameter: max_completion_tokens
  serializer: openai
  usage_semantics: openai
  source: https://developers.openai.com/api/docs/guides/reasoning
  verified_on: '2025-06-01'
- provider: openai
